seed: 42
seeds: [42, 43, 44, 45, 46]
device: cuda
manifest: data/manifest.csv
splits_dir: data/splits
features_dir: features
output_dir: outputs
n_clusters: null  # prepare_data writes dataset metadata; evaluation uses that class count
clip:
  model: openai/clip-vit-base-patch32
  revision: null  # set to a Hugging Face commit for a fully pinned model
  local_files_only: false
  batch_size: 32
model:
  dim: 512
  hidden: 512
  time_dim: 128
  timesteps: 100
  beta_schedule: squaredcos_cap_v2
train:
  epochs: 100
  batch_size: 128
  lr: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  feature_scale: 22.627416998  # sqrt(512), applied to BOTH target and condition
sample:
  steps: 20
  batch_size: 256
  seed: 1234
baselines:
  methods: [zero, mean, knn, ridge, mlp]
  knn_k: [1, 3, 5, 10, 20]
  ridge_alpha: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0, 1000.0]
  val_rate: 0.3
  val_seed_offset: 777
  mlp:
    hidden: 512
    epochs: 100
    patience: 15
    lr: 0.001
    weight_decay: 0.0001
    batch_size: 128
experiments:
  mask_seed: 42
  kmeans_seed: 42
  n_init: 20
  rates: [0.1, 0.3, 0.5, 0.7]
  rate: 0.5
  reconstruction_rate: 0.3
  generated_weight: 0.5
  generated_weights: [0.0, 0.25, 0.5, 0.75, 1.0]
  ddim_steps: [5, 10, 20, 50]
  tsne_perplexity: 30
aggregation:
  root: null
